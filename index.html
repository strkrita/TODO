<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="css/favicon.png" type="image/png">
</head>
<body>
    <div class="mainWrapper">
        <div class="header">
            <h1 class="header__title">TODO LIST</h1>
            <div class="taskFilter">
                <button class="taskFilter__trigger" aria-expanded="false" aria-haspopup="listbox">
                    ALL
                </button>

                <ul class="taskFilter__list" role="listbox" aria-label="Filter tasks">
                    <li class="taskFilter__option" role="option" aria-selected="true">All</li>
                    <li class="taskFilter__option" role="option">Complete</li>
                    <li class="taskFilter__option" role="option">Incomplete</li>
                </ul>
            </div>
        </div>

        <div class="mainBody">
            <ul class="noteList">
                <div class="noteList__listIsEmpty">
                    <img src="css/empty_notelist.svg">
                    <p>Empty...</p>
                </div>
            </ul>
            <button class="mainBody__addNote"></button>
        </div>
    </div>

    <div class="addNoteModal addNoteModal_hidden">
        <div class="modalContent">
            <div class="modalContent__title modalContent__title_isEditingNote">NEW NOTE</div>
            <input class="modalContent__inputNote" id="inputNote" type="text" placeholder="Input your note..." maxlength="100">
            <div class="modalButtons">
                <button class="modalButtons__cancel">CANCEL</button>
                <button class="modalButtons__apply">APPLY</button>
            </div>
        </div>
    </div>

    <div class="loadingDots">
        <div class="dots">
            <span class="dots__dot"></span>
            <span class="dots__dot"></span>
            <span class="dots__dot"></span>
        </div>
    </div>
</body>
<script src="js/main.js"></script>
</html>
